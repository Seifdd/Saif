name: Build Test APK from android folder

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP archive
        run: |
          set -e
          mkdir -p unpacked_src
          unzip -o "*.zip" -d unpacked_src
          find unpacked_src -maxdepth 3 -ls

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & Build Tools
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Compile and Package Test APK
        run: |
          set -e
          SRC_ROOT=$(find unpacked_src -type d -name "android" | head -n 1)
          if [ -z "$SRC_ROOT" ]; then
            echo "لم يتم العثور على مجلد android"
            exit 1
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$SDK_ROOT/build-tools/35.0.0"
          JAR="$SDK_ROOT/platforms/android-35/android.jar"
          WORK="$RUNNER_TEMP/apk_build"
          rm -rf "$WORK"
          mkdir -p "$WORK/res_compiled" "$WORK/gen" "$WORK/classes" "$WORK/dex" "$WORK/out"

          "$BT/aapt2" compile --dir "$SRC_ROOT/res" -o "$WORK/res_compiled/"
          "$BT/aapt2" link \
            -o "$WORK/unsigned_base.apk" \
            -I "$JAR" \
            --manifest "$SRC_ROOT/AndroidManifest.xml" \
            --min-sdk-version 29 \
            --target-sdk-version 35 \
            --java "$WORK/gen" \
            "$WORK/res_compiled/"*.flat

          find "$SRC_ROOT/src" "$WORK/gen" -name '*.java' > "$WORK/srcs.txt"
          javac --release 17 -nowarn -classpath "$JAR" -d "$WORK/classes" @"$WORK/srcs.txt"
          "$BT/d8" --min-api 29 --output "$WORK/dex" $(find "$WORK/classes" -name '*.class')

          cp "$WORK/unsigned_base.apk" "$WORK/aligned.apk"
          (cd "$WORK/dex" && zip -u "$WORK/aligned.apk" classes*.dex)

          "$BT/zipalign" -f -p 4 "$WORK/aligned.apk" "$WORK/aligned_final.apk"
          KEYSTORE="$WORK/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$BT/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$WORK/out/bo3-recomp-test-debug.apk" \
            "$WORK/aligned_final.apk"

          ls -lh "$WORK/out/bo3-recomp-test-debug.apk"

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bo3-recomp-test-apk
          path: /home/runner/work/_temp/apk_build/out/*.apk
