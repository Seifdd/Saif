name: Unpack Zip and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP archive
        run: |
          mkdir -p unpacked_src
          unzip -o "*.zip" -d unpacked_src
          find unpacked_src -maxdepth 3 -ls

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & NDK packages
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.3.11579264"

      - name: Build Android APK
        run: |
          set -e
          ANDROID_DIR=$(find unpacked_src -type d -name "android" | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "لم يتم العثور على مجلد android داخل الأرشيف"
            exit 1
          fi
          if [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "ملف gradlew غير موجود في $ANDROID_DIR؛ هذا المشروع يستخدم سكريبتات/أدوات مثل tools/prepare.sh ولا يحتوي على مشروع Gradle جاهز"
            exit 1
          fi
          chmod +x "$ANDROID_DIR/gradlew"
          (cd "$ANDROID_DIR" && ./gradlew assembleDebug --stacktrace)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bo3-recomp-apk
          path: unpacked_src/**/android/app/build/outputs/apk/debug/*.apk
